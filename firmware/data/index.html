<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Feeder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #2c3e50; margin-top: 0; }
        .data-row { display: flex; justify-content: space-between; font-size: 1.2em; border-bottom: 1px solid #eee; padding: 10px 0; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-right: 10px; margin-bottom: 15px; }
        button:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .table-container { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐾 Feeder Status</h1>
        <div class="data-row"><span>Bowl Weight:</span> <strong id="weight">... g</strong></div>
        <div class="data-row"><span>Food Level:</span> <strong id="level">... %</strong></div>
    </div>

    <div class="card">
        <h2>📊 System Logs (CSV)</h2>
        <button onclick="loadLogs()">Refresh Logs</button>
        <button class="btn-danger" onclick="clearLogs()">Clear Logs</button>
        
        <div class="table-container">
            <table id="logTable">
                <thead>
                    <tr>
                        <th>Time (ms)</th>
                        <th>Event</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <tr><td colspan="2">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        setInterval(async () => {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                document.getElementById('weight').innerText = data.weight + ' g';
                document.getElementById('level').innerText = data.feed_level + ' %';
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }, 3000);

        async function loadLogs() {
            try {
                const response = await fetch('/log.csv');
                if (!response.ok) throw new Error("File not found");
                const text = await response.text();
                
                const rows = text.trim().split('\n');
                const tbody = document.getElementById('logBody');
                tbody.innerHTML = '';

                if (rows.length === 0 || rows[0] === "") {
                    tbody.innerHTML = '<tr><td colspan="2">Log file is empty.</td></tr>';
                    return;
                }

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(',');
                    if (cols.length >= 2) {
                        const tr = document.createElement('tr');
                        
                        const tdTime = document.createElement('td');
                        tdTime.innerText = cols[0];
                        
                        const tdEvent = document.createElement('td');
                        tdEvent.innerText = cols.slice(1).join(','); 
                        
                        tr.appendChild(tdTime);
                        tr.appendChild(tdEvent);
                        tbody.appendChild(tr);
                    }
                }
            } catch (err) {
                document.getElementById('logBody').innerHTML = '<tr><td colspan="2">Failed to load log. The file may not exist yet.</td></tr>';
            }
        }

        async function clearLogs() {
            await fetch('/clear_log');
            loadLogs();
        }

        loadLogs();
    </script>

</body>
</html>
